<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        
        <div class="input-section">
            <input type="url" id="longUrl" placeholder="Enter your long URL..." required>
            <button id="shortenBtn">Shorten URL</button>
        </div>

        <div id="result" class="result hidden">
            <div class="result-item">
                <p><strong>Original:</strong> <span id="originalUrl"></span></p>
                <p><strong>Shortened:</strong> <input type="text" id="shortUrl" readonly></p>
                <button id="copyBtn">Copy to Clipboard</button>
            </div>
        </div>

        <div id="history" class="history">
            <h2>Recent URLs</h2>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
